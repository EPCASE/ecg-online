<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcours de maîtrise ECG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/pathway.css">
</head>
<body>
  <header class="pathway-topbar">
    <a class="brand-link" href="/static/pathways.html">ECG Lecture<span>Parcours de maîtrise</span></a>
    <div class="progress-wrap" aria-label="Progression du parcours">
      <div class="progress-meta">
        <span id="pathway-title">Chargement…</span>
        <span id="progress-label">0 / 0 ECG</span>
      </div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    </div>
    <div class="topbar-actions">
      <a href="/static/pathways.html">Tous les parcours</a>
      <a href="/?view=bank">Banque libre</a>
      <button id="reset-pathway" type="button">Réinitialiser</button>
    </div>
  </header>

  <main class="pathway-main">
    <div id="pathway-root" aria-live="polite">
      <div class="loading-card">Chargement du parcours…</div>
    </div>
  </main>

  <div id="pathway-lightbox" class="pathway-lightbox hidden" role="dialog" aria-modal="true" aria-label="Tracé ECG agrandi">
    <div class="lightbox-toolbar" aria-label="Contrôles de la visionneuse">
      <button id="lightbox-zoom-out" type="button" aria-label="Dézoomer">−</button>
      <button id="lightbox-reset" type="button">100 %</button>
      <button id="lightbox-zoom-in" type="button" aria-label="Zoomer">+</button>
      <button id="lightbox-close" type="button">Fermer</button>
    </div>
    <div class="lightbox-scroll">
      <div id="lightbox-stage" class="lightbox-stage">
        <img id="lightbox-image" src="" alt="Tracé ECG agrandi">

      </div>
    </div>
  </div>

  <!-- Modale de signalement (version pré-alpha) — même composant que index.html -->
  <div id="report-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="report-title">
    <div class="modal-card">
      <button type="button" id="report-close" class="modal-close" aria-label="Fermer">✕</button>
      <h3 id="report-title">🧪 Signaler un problème</h3>
      <p class="modal-sub">
        Merci d'aider à améliorer cet outil <strong>pré-alpha</strong>. Décris ce
        qui te semble faux ou étrange (score, commentaire, tracé, bug…).
      </p>
      <label for="report-category">Type de problème</label>
      <select id="report-category" class="modal-field">
        <option value="correction">Correction / score incohérent</option>
        <option value="negation">Négation mal prise en compte</option>
        <option value="contenu">Erreur dans l'énoncé ou le tracé</option>
        <option value="bug">Bug technique</option>
        <option value="autre">Autre</option>
      </select>
      <label for="report-message">Ta description</label>
      <textarea id="report-message" class="modal-field" rows="5"
        placeholder="Ex. Cas 57 : j'ai écrit « SCA ST+ et miroir » et le miroir a été compté juste alors que la référence dit « sans miroir »."></textarea>
      <p id="report-context" class="modal-context"></p>
      <div class="modal-actions">
        <button type="button" id="report-send" class="btn-primary">
          <span class="btn-label">Envoyer</span>
          <span class="spinner hidden"></span>
        </button>
        <button type="button" id="report-cancel" class="btn-ghost">Annuler</button>
      </div>
      <div id="report-status" class="modal-status hidden"></div>
    </div>
  </div>

  <script src="/static/pathway-core.js"></script>
  <script src="/static/timing.js"></script>
  <script src="/static/pathway.js"></script>
</body>
</html>
